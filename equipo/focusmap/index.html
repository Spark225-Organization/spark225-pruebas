<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Focus Map Spark225</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bitter:wght@500;600;700&display=swap">
<style>
/* Layout: banda de marca arriba, pestañas, contenido en una columna ancha; la cuadrícula semanal es el centro del producto */
:root{
  /* Identidad Spark225: misma paleta y tipografía que el Cockpit y el Reporte Financiero */
  --bg:#F7F4F0; --surface:#FFFFFF; --sunken:#FBF8F5; --ink:#191512; --muted:#5E554C; --faint:#8C8175; --line:#E3DBD1; --line-soft:#F0E9E1; --line-hard:#C9BFB3;
  --band:#FCEEE0; --band-ink:#191512; --band-muted:#8F4109;
  --strong:#191512; --strong-ink:#F7F4F0; --strong-muted:#B3A99E; --strong-line:#463C32;
  --accent:#D2600F; --accent-text:#8F4109; --accent-ink:#FFFFFF; --accent-soft:#FBEBDC;
  --s:#1F6F52; --g:#4E9A72; --y:#D9A21B; --r:#A83224; --n:#E3DBD1; --n-ink:#8C8175; --g-ink:#FFFFFF; --y-ink:#2B2110;
  --warn:#8A5A00; --warn-soft:#FAEFD8;
  --font-display:Bitter, Georgia, serif;
  --font-body:Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151310; --surface:#1F1B17; --sunken:#251F1A; --ink:#F2EDE7; --muted:#B3A99E; --faint:#877C71; --line:#332C25; --line-soft:#28221C; --line-hard:#463C32;
  --band:#2E2118; --band-ink:#F2EDE7; --band-muted:#F0A469;
  --strong:#2B241E; --strong-ink:#F2EDE7; --strong-muted:#B3A99E; --strong-line:#463C32;
  --accent:#E4863B; --accent-text:#F0A469; --accent-ink:#151310; --accent-soft:#33241A;
  --s:#3E9A73; --g:#6FBF92; --y:#D9A94A; --r:#D0604F; --n:#332C25; --n-ink:#877C71; --g-ink:#151310; --y-ink:#151310;
  --warn:#D9A94A; --warn-soft:#2B2110; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151310; --surface:#1F1B17; --sunken:#251F1A; --ink:#F2EDE7; --muted:#B3A99E; --faint:#877C71; --line:#332C25; --line-soft:#28221C; --line-hard:#463C32;
  --band:#2E2118; --band-ink:#F2EDE7; --band-muted:#F0A469;
  --strong:#2B241E; --strong-ink:#F2EDE7; --strong-muted:#B3A99E; --strong-line:#463C32;
  --accent:#E4863B; --accent-text:#F0A469; --accent-ink:#151310; --accent-soft:#33241A;
  --s:#3E9A73; --g:#6FBF92; --y:#D9A94A; --r:#D0604F; --n:#332C25; --n-ink:#877C71; --g-ink:#151310; --y-ink:#151310;
  --warn:#D9A94A; --warn-soft:#2B2110; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
.notebox{grid-column:1/-1;display:grid;gap:8px;background:var(--warn-soft);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:var(--radius);padding:10px 12px}
.notebox.R{border-left-color:var(--r)}
.notebox .h{font-size:12px;font-weight:700;color:var(--warn)}
.notebox .row2{gap:8px}
.cell{position:relative}
.cell.has-note::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9}
.cell.Y.has-note::after{background:var(--y-ink)}
.kidnote{font-size:13px;color:var(--muted);margin-top:4px;border-left:2px solid var(--y);padding-left:8px}
.kidnote.R{border-left-color:var(--r)}
.kidnote b{color:var(--ink);font-weight:600}
.align{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:4px;width:100%}
.align .lab{font-family:var(--font-display);font-size:17px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--accent-text);margin-right:8px}
.goal{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.goal b{font-weight:700;color:var(--ink)}
.goal.miss{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.goal.miss b{color:var(--warn)}
.meet{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.meet{grid-template-columns:1fr}}
.mcol{display:grid;gap:16px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;border-left:4px solid var(--accent);padding-left:10px}
.sec-h h3{font-size:18px;font-weight:600}
.sec-h .foot{margin-left:auto}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.item:first-of-type{border-top:0}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--muted)}
.item .why{font-size:13px;margin-top:6px;display:grid;gap:2px}
.item .why span{color:var(--muted)}
.item .why b{color:var(--ink);font-weight:600}
.trend{font-size:12px;font-weight:700;white-space:nowrap}
.trend.up{color:var(--s)} .trend.down{color:var(--r)} .trend.eq{color:var(--faint)}
.overdue{color:var(--r);font-weight:700}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.stat .v{font-family:var(--font-display);font-size:24px;font-weight:700;margin-top:2px}
.stat .v.bad{color:var(--r)} .stat .v.warn{color:var(--warn)} .stat .v.ok{color:var(--s)}
.owner-g{padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.owner-g:first-of-type{border-top:0}
.owner-g b{display:block}
.owner-g span{color:var(--muted);font-size:13px}
.agr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-soft)}
.agr:first-of-type{border-top:0}
.agr input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.agr.done .tx{text-decoration:line-through;color:var(--faint)}
.agr .m{font-size:12px;color:var(--muted)}
.agrform{display:grid;grid-template-columns:minmax(0,1fr) 140px 150px auto;gap:8px;margin-top:10px}
@media (max-width:640px){.agrform{grid-template-columns:1fr 1fr}.agrform .input:first-child{grid-column:1/-1}}
.weeknav{display:flex;align-items:center;gap:8px}
.person{display:grid;gap:4px}
.person .ph{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);flex:none}
.person .ph h3{font-size:19px;font-weight:700}
.person .ph .foot{margin-left:auto}
.prow2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.prow2:first-of-type{border-top:0}
.prow2 .t{font-weight:600}
.prow2 .m{font-size:13px;color:var(--muted)}
.prow2 .v{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}
.trail{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.trail i{width:14px;height:14px;border-radius:2px;display:inline-block}
.trail i.S{background:var(--s)}.trail i.G{background:var(--g)}.trail i.Y{background:var(--y)}.trail i.R{background:var(--r)}.trail i.N{background:var(--n)}
.trail i.cur{outline:2px solid var(--accent);outline-offset:1px}
.turnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--band);border:1px solid var(--line-hard);border-radius:var(--radius);padding:10px 14px}
.turnbar b{font-family:var(--font-display);font-size:17px}
.persons{display:grid;gap:16px}
.person.big .prow2 .t{font-size:17px}
.person.big .prow2 .v{font-size:26px}
.goalrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);font-weight:700}

/* Banda superior */
.band{background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--line-hard)}
.band .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:20px 16px}
.brand{display:flex;align-items:center;gap:13px}
.brand img{height:34px;width:auto;display:block;flex:none}
.brand .sub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--band-muted);margin:0}
.brand h1{font-size:21px;font-weight:700;margin:0}
.qpick{display:flex;flex-direction:column;gap:4px}
.qpick label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted);font-weight:700}
.qpick select{background:var(--surface);color:var(--ink);border:1px solid var(--line-hard);border-radius:2px;padding:5px 9px;min-width:160px;font-weight:500}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.tab{background:none;border:0;padding:13px 15px;font-size:14px;letter-spacing:.02em;font-weight:600;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-color:var(--accent)}

main{padding-block:20px 48px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:20px}

.btn{border:1px solid var(--line-hard);background:var(--surface);border-radius:var(--radius);padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--r)}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{border:0;background:none;color:inherit;opacity:.7;padding:4px 6px;border-radius:6px}
.own{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);font-weight:600;font-size:11.5px;letter-spacing:.01em;line-height:1;padding:2px 9px 2px 2px;border-radius:999px;white-space:nowrap;vertical-align:middle}.own i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:9.5px;font-weight:700}.own.none{background:transparent;border-style:dashed;color:var(--muted);padding-left:9px}.own.none i{display:none}tr.co .own{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--strong-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fbtn{font-size:11px;font-weight:600;border:1px solid var(--line-hard);border-radius:999px;padding:2px 8px;opacity:1;color:var(--muted);background:var(--surface)}
.fbtn.ok{border-color:var(--g);color:var(--s)}.fbtn.miss{border-color:var(--y);color:var(--warn);background:var(--warn-soft)}
.fdet{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--sunken)}.fdet summary{cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}.fdet .fbody{display:grid;gap:12px;margin-top:12px}
.fsum{display:grid;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:13px}
.fsum b{font-weight:600}.fsum .ln a{color:var(--accent-text)}
.flist{display:grid;gap:6px}.flist .fr{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;align-items:center}
.flist .ff{display:flex;gap:8px;align-items:center;font-size:13px}.flist .ff a{color:var(--accent-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.icon-btn:hover{opacity:1;background:rgba(127,127,127,.18)}

/* Encabezado del trimestre */
.qhead{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;border-top:3px solid var(--accent)}
.qhead h2{font-size:26px;font-weight:700}
.qhead .success{color:var(--muted);margin-top:4px}
.qhead .right{text-align:right;display:grid;gap:6px;justify-items:end}
.qhead .qlabel{font-family:var(--font-display);font-weight:700;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}
.pill.muted{background:var(--sunken);color:var(--muted)}

/* Barra de reporte semanal */
.reportbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.reportbar .meter{flex:1;min-width:180px}
.track{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-top:8px}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.mix{display:flex;gap:6px;flex-wrap:wrap}

/* Chips de estado */
.chip{width:28px;height:28px;border-radius:3px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:12px;color:#fff;flex:none}
.chip.S{background:var(--s)} .chip.G{background:var(--g);color:var(--g-ink)} .chip.Y{background:var(--y);color:var(--y-ink)} .chip.R{background:var(--r)} .chip.N{background:var(--n);color:var(--n-ink)}
.chip.sm{width:22px;height:22px;font-size:11px;border-radius:6px}

/* Lista de prioridades (Mapa) */
.plist{display:grid;gap:10px}
.prow{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.prow-main{display:flex;align-items:center;gap:14px;padding:14px 16px}
.num{width:28px;height:28px;border-radius:3px;background:var(--sunken);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px;flex:none}
.prow .title{font-weight:600;font-size:16px}
.prow .meta{color:var(--muted);font-size:13px}
.prow .grow{flex:1;min-width:0}
.kids{border-top:1px solid var(--line);background:var(--sunken)}
.kid{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 58px;font-size:14px}
.kid+.kid{border-top:1px solid var(--line)}
.kid .grow{flex:1;min-width:0}
.kid .val{color:var(--muted);font-size:13px}

/* Cuadrícula semana a semana */
.gridbox{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:940px}
.grid th,.grid td{padding:6px 4px;text-align:center}
.grid th{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:500}
.grid th.cur{color:var(--accent);font-weight:600}
.grid .namecol{text-align:left;padding-left:14px;width:32%;min-width:240px}
.grid tr.co td{background:var(--strong);color:var(--strong-ink)}
.grid tr.co td:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.grid tr.co td:last-child{border-radius:0 var(--radius) var(--radius) 0}
.grid tr.co .namecell{display:flex;align-items:center;gap:10px;font-weight:600}
.grid tr.co .num{background:var(--strong-line);color:var(--strong-ink)}
.grid tr.kidrow td{border-bottom:1px solid var(--line)}
.grid tr.spacer td{height:12px;padding:0}
.grid .actions{display:flex;gap:2px;justify-content:flex-end;align-items:center;white-space:nowrap}
.grid tr.co .btn{background:transparent;color:var(--strong-ink);border-color:var(--strong-line)}
.cell{width:34px;height:30px;border-radius:3px;border:1px dashed var(--line);background:none;color:var(--muted);font-family:var(--font-mono);font-size:12px;display:inline-grid;place-items:center}
.cell:hover{border-color:var(--accent);color:var(--accent)}
.cell.filled{border:0;color:#fff;font-weight:600}
.cell.S{background:var(--s)} .cell.G{background:var(--g);color:var(--g-ink)} .cell.Y{background:var(--y);color:var(--y-ink)} .cell.R{background:var(--r)}
.cell.cur{box-shadow:0 0 0 2px var(--accent)}
.cell.future{opacity:.45}
.roll{width:34px;height:30px;border-radius:3px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:600}
.roll.S{background:var(--s);color:#fff}.roll.G{background:var(--g);color:var(--g-ink)}.roll.Y{background:var(--y);color:var(--y-ink)}.roll.R{background:var(--r);color:#fff}.roll.N{background:var(--strong-line);color:var(--strong-muted)}

.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.foot{font-size:12px;color:var(--muted)}

/* Trimestres */
.qtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtools .grow{flex:1}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:600;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.qcard{display:flex;flex-direction:column;gap:12px;padding:20px}
.qcard .top{display:flex;align-items:center;gap:10px}
.qcard h3{font-size:22px;font-weight:700}
.qcard .theme{color:var(--muted);font-size:14px;min-height:42px}
.stats{display:flex;gap:28px}
.stats .v{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent-text);line-height:1}
.qcard .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.qcard .acts .btn.primary{flex:1;justify-content:center}

/* Estados vacíos */
.empty{text-align:center;padding:40px 20px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{color:var(--ink);font-size:20px}

/* Modal */
dialog{border:1px solid var(--line-hard);padding:0;border-radius:var(--radius);background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,16,.55)}
.mhead{background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--line-hard);padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mhead .eyebrow{color:var(--band-muted)}
.mhead h3{font-size:21px;font-weight:700;margin-top:2px}
.mbody{padding:20px 22px;display:grid;gap:16px;overflow:auto}
.mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;border:1px solid var(--line-hard);background:var(--surface);border-radius:2px;padding:9px 12px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.namerow{display:grid;grid-template-columns:56px 1fr;gap:10px}
.namerow .input:first-child{text-align:center;font-size:18px;padding:6px}
.thr{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.thr .lab{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.help{font-size:13px;color:var(--muted);margin:0}
.try{background:var(--sunken);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.try .input{width:120px}
.err{color:var(--r);font-size:13px;margin:0}
.rep-list{display:grid;gap:8px}
.rep{display:grid;grid-template-columns:1fr 130px 30px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.rep .t{font-weight:600;font-size:14px}
.rep .m{font-size:12px;color:var(--muted)}
.rep .grp{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.confirm{border:1px solid var(--r);border-radius:8px;padding:12px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50}
.demo-banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.demo-banner p{margin:4px 0 0;max-width:70ch}
.demo-banner .grow{flex:1;min-width:240px}
.infowrap{position:relative;display:inline-flex}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center;padding:0}
.info[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pop{position:absolute;top:30px;left:0;z-index:20;width:min(360px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 40px rgba(0,0,0,.18);padding:16px;display:grid;gap:8px;font-size:14px;font-weight:400;color:var(--muted);text-align:left}
.pop b{color:var(--ink)}
.pop p{margin:0}
.prow-main{padding:0 16px 0 0;gap:14px;min-height:72px}
.stripe{align-self:stretch;width:30px;flex:none;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.stripe span{writing-mode:vertical-rl;transform:rotate(180deg)}
.stripe.S{background:var(--s)}.stripe.G{background:var(--g);color:var(--g-ink)}.stripe.Y{background:var(--y);color:var(--y-ink)}.stripe.R{background:var(--r)}.stripe.N{background:var(--n);color:var(--n-ink)}
.prow-main .grow{padding-block:14px}
.kidchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* Descripción al pasar el mouse sobre un cuadro del Mapa */
.prow{overflow:visible}
.stripe{border-radius:var(--radius) 0 0 var(--radius)}
.kids{border-radius:0 0 var(--radius) var(--radius)}
.tipwrap{position:relative;display:inline-flex}
.tip{position:absolute;bottom:calc(100% + 9px);right:0;z-index:30;width:max-content;max-width:min(340px,70vw);background:var(--strong);color:var(--strong-ink);border:1px solid var(--strong-line);border-radius:var(--radius);padding:10px 13px;font-size:13px;line-height:1.45;text-align:left;display:none;box-shadow:0 14px 34px rgba(0,0,0,.28);pointer-events:none;white-space:normal}
.tip::after{content:"";position:absolute;top:100%;right:9px;border:6px solid transparent;border-top-color:var(--strong)}
.tip b{display:block;font-weight:600;font-size:14px;color:var(--strong-ink);margin-bottom:5px}
.tip .st{display:flex;align-items:center;gap:7px;color:var(--strong-muted)}
.tip .st .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tip .hint{color:var(--strong-muted);font-size:11.5px;margin-top:5px;opacity:.85}
.dot.S{background:var(--s)}.dot.G{background:var(--g)}.dot.Y{background:var(--y)}.dot.R{background:var(--r)}.dot.N{background:var(--n)}
.tipwrap:hover .tip,.tipwrap:focus-within .tip{display:block}
button.chip{border:0;cursor:pointer;padding:0;transition:transform .12s}
button.chip:hover{transform:scale(1.12)}
.grid tr.kidrow.focus td{background:var(--accent-soft);transition:background .6s}
.cell.pick{box-shadow:0 0 0 3px var(--accent)!important}
.grid th.focus{color:var(--accent-text);font-weight:700}
.toggle{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 0;display:inline-flex;gap:4px;align-items:center}
.toggle:hover{color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.steps i{height:4px;border-radius:2px;background:var(--line-hard)}
.steps i.on{background:var(--accent)}
.labelbox{background:var(--sunken);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.labelbox b{font-family:var(--font-display);font-size:20px;font-weight:700}
.datebox{background:var(--sunken);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted)}
.datebox b{color:var(--ink)}
.opt{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:20px 1fr;gap:4px 10px;cursor:pointer;align-items:start}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:3px 0 0;accent-color:var(--accent)}
.opt b{font-size:15px}
.opt span{grid-column:2;font-size:13px;color:var(--muted)}
.kidcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.kidcard .hd{display:flex;justify-content:space-between;align-items:center}
.req{color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.notice{border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted)}

@media (max-width:640px){
  .qhead .right{text-align:left;justify-items:start}
  .row3{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .rep{grid-template-columns:1fr 100px 28px}
  .kid{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* =====================================================================
   Focus Map Spark225 · capa de datos para el Portal de colaboradores
   ---------------------------------------------------------------------
   Sustituye la capa «intranet» del archivo original. La app es la misma:
   usa window.claude.use("db" | "user" | "assets" | "downloads").

   - Datos: tabla docs del Portal (Supabase, con sesión y reglas RLS).
       quarters → fm_trimestres · priorities → fm_prioridades · reports → fm_reportes
       settings → fm_ajustes · kpimeta → fm_fichas (meetings queda en memoria; el original no tiene pantalla)
     Cada documento se guarda tal cual lo escribe la app original (mismos campos).
   - Usuario: la sesión del Portal. Roles como el original: Dirección (dueño) administra; los demás capturan.
   - Sin datos de la empresa en este archivo: todo llega de la base.
   ===================================================================== */
(function(){
  const q = new URLSearchParams(location.search);
  if (q.get("tema") === "light" || q.get("tema") === "dark") document.documentElement.dataset.theme = q.get("tema");

  const MAPA = { quarters: "fm_trimestres", priorities: "fm_prioridades", reports: "fm_reportes", settings: "fm_ajustes", kpimeta: "fm_fichas" };
  const INV = Object.fromEntries(Object.entries(MAPA).map(([a, b]) => [b, a]));
  const COLLS = ["quarters", "priorities", "reports", "settings", "kpimeta", "meetings"];
  const clone = o => JSON.parse(JSON.stringify(o));
  let DATA = {}; COLLS.forEach(c => DATA[c] = {});
  const subs = new Set();
  const notify = () => subs.forEach(fn => { try { fn(); } catch(e) { console.error(e); } });
  let sb = null, ME = null, USERS = [];

  // Modo demo (Portal sin sesión): todo en este navegador, sin tocar la base.
  let DEMO = false;
  const LS_DEMO = "focusmap.portal.demo";
  async function cargar(){
    const d = {}; COLLS.forEach(c => d[c] = {});
    if (DEMO) { try { const g = JSON.parse(localStorage.getItem(LS_DEMO) || "{}"); COLLS.forEach(c => d[c] = g[c] || {}); } catch(e) {} return d; }
    for (let desde = 0; ; desde += 1000) {
      const { data, error } = await sb.from("docs").select("coleccion,id,datos").in("coleccion", Object.values(MAPA)).eq("borrado", false).range(desde, desde + 999);
      if (error) throw error;
      data.forEach(f => { d[INV[f.coleccion]][f.id] = f.datos; });
      if (data.length < 1000) break;
    }
    d.meetings = DATA.meetings || {};
    return d;
  }
  const guardaDemo = () => { try { localStorage.setItem(LS_DEMO, JSON.stringify(DATA)); } catch(e) {} };
  async function poner(c, id, doc){
    if (DEMO) return guardaDemo();
    if (!MAPA[c]) return; // meetings: solo en memoria
    const { error } = await sb.from("docs").upsert({ coleccion: MAPA[c], id, datos: doc, visible_para: null, borrado: false }, { onConflict: "coleccion,id" });
    if (error) throw error;
  }
  async function quitar(c, id){
    if (DEMO) return guardaDemo();
    if (!MAPA[c]) return;
    const { error } = await sb.from("docs").update({ borrado: true }).eq("coleccion", MAPA[c]).eq("id", id);
    if (error) throw error;
  }

  function sinSesion(){
    const pinta = () => { const app = document.getElementById("app"); if (app) app.innerHTML = '<div class="panel empty"><h3>Entra con tu cuenta</h3><p>El Focus Map usa tu sesión del Portal de colaboradores. Entra con Google desde el Portal y vuelve a abrir esta pestaña.</p></div>'; };
    document.readyState === "loading" ? addEventListener("DOMContentLoaded", pinta) : pinta();
  }

  const ready = (async () => {
    const [{ createClient }, cfg] = await Promise.all([
      import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"),
      import("../nube-config.js"),
    ]);
    sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, flowType: "pkce", storageKey: "ssam-equipo-auth" } });
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      if (q.get("demo") !== "1") throw Object.assign(new Error("Sin sesión"), { code: "sin_sesion" });
      DEMO = true; ME = { id: "demo", name: "Demo", role: "admin" }; USERS = [ME]; DATA = await cargar(); window.__focusmapMode = "demo"; return;
    }
    const { data: perfiles, error } = await sb.from("perfiles").select("id,nombre,corto,permiso,auth_uid").neq("permiso", "pendiente");
    if (error) throw error;
    USERS = (perfiles || []).map(p => ({ id: p.id, name: p.corto || p.nombre, role: p.permiso === "dueno" ? "admin" : "editor", auth: p.auth_uid }));
    ME = USERS.find(u => u.auth === session.user.id) || null;
    DATA = await cargar();
    // Como el original: vuelve a leer cada 15 s y repinta si alguien más cambió algo.
    setInterval(async () => { try { const n = await cargar(); if (JSON.stringify(n) !== JSON.stringify(DATA)) { DATA = n; notify(); } } catch(e) {} }, 15000);
    window.__focusmapMode = "portal";
  })().catch(e => { console.error(e); window.__focusmapLoadError = e; if (e.code === "sin_sesion") sinSesion(); });

  /* ---------- API tipo db (la misma que usa la app) ---------- */
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const snapColl = c => ({ docs: Object.entries(DATA[c] || {}).map(([id, d]) => ({ id, exists: true, data: () => clone(d) })) });
  const snapDoc = (c, id) => { const d = (DATA[c] || {})[id]; return { id, exists: !!d, data: () => d ? clone(d) : undefined }; };
  const split = path => { const i = path.indexOf("/"); return [path.slice(0, i), path.slice(i + 1)]; };
  async function write(c, id, doc){ const prev = (DATA[c] || {})[id];
    if (doc === null) delete DATA[c][id]; else DATA[c][id] = doc;
    notify();
    try { doc === null ? await quitar(c, id) : await poner(c, id, doc); }
    catch(e){ if (prev === undefined) delete DATA[c][id]; else DATA[c][id] = prev; notify(); alert("No se pudo guardar: " + (e.message || e)); throw e; } }
  const db = {
    collection(c){ return {
      onSnapshot(cb, err){ const fn = () => cb(snapColl(c)); subs.add(fn); ready.then(() => window.__focusmapLoadError ? err && err({ code: "load_failed" }) : fn()); return () => subs.delete(fn); },
      async add(d){ await ready; const id = newId(); await write(c, id, clone(d)); return { id }; },
      doc(id){ return db.doc(c + "/" + id); }
    }; },
    doc(path){ const [c, id] = split(path); return {
      onSnapshot(cb, err){ const fn = () => cb(snapDoc(c, id)); subs.add(fn); ready.then(() => window.__focusmapLoadError ? err && err({ code: "load_failed" }) : fn()); return () => subs.delete(fn); },
      async get(){ await ready; return snapDoc(c, id); },
      async set(d){ await ready; await write(c, id, clone(d)); },
      async update(d){ await ready; const cur = (DATA[c] || {})[id]; if (!cur) throw Object.assign(new Error("No existe"), { code: "not_found" }); await write(c, id, Object.assign(clone(cur), clone(d))); },

function statusFor(c, v){
  if (v === null || v === undefined || v === "") return "N";
  if (critKind(c)==="bool") return (v === true || v === "true" || v === 1 || v === "1") ? "G" : "R";
  const n=toNum(c,v), sg=toNum(c,c.sg), g=toNum(c,c.g), r=toNum(c,c.r);
  if ([n,sg,g,r].some(Number.isNaN)) return "N";
  if (critDir(c)==="down"){ if(n<=sg) return "S"; if(n<=g) return "G"; if(n>=r) return "R"; return "Y"; }
  if(n>=sg) return "S"; if(n>=g) return "G"; if(n<=r) return "R"; return "Y";
}
function critValid(c){
  const k=critKind(c);
  if(k==="bool") return {ok:true};
  const sg=toNum(c,c.sg), g=toNum(c,c.g), r=toNum(c,c.r);
  if([sg,g,r].some(Number.isNaN)) return {ok:false,msg: k==="date" ? "Elige las tres fechas: súper verde, verde y rojo." : "Súper verde, verde y rojo son obligatorios."};
  if(k==="pct" && [sg,g,r].some(x=>x<0||x>100)) return {ok:false,msg:"Los porcentajes van de 0 a 100."};
  if(k==="date" && !(sg<=g && g<r)) return {ok:false,msg:"Con fechas se espera: súper verde (la más temprana) ≤ verde < rojo (la más tardía)."};
  if(k!=="date" && critDir(c)==="up" && !(sg>=g && g>r)) return {ok:false,msg:"Si más es mejor: súper verde ≥ verde > rojo."};
  if(k!=="date" && critDir(c)==="down" && !(sg<=g && g<r)) return {ok:false,msg:"Si menos es mejor: súper verde ≤ verde < rojo."};
  return {ok:true};
}
function fmtThr(c, x){ const k=critKind(c); return k==="pct" ? `${x}%` : k==="date" ? fmtDay(x) : `${x}`; }
function critText(c){
  const k=critKind(c);
  if(k==="bool") return "Sí / No";
  if(k==="date") return `S antes de ${fmtThr(c,c.sg)} · V antes de ${fmtThr(c,c.g)} · R desde ${fmtThr(c,c.r)}`;
  return critDir(c)==="up" ? `S ≥ ${fmtThr(c,c.sg)} · V ≥ ${fmtThr(c,c.g)} · R ≤ ${fmtThr(c,c.r)}` : `S ≤ ${fmtThr(c,c.sg)} · V ≤ ${fmtThr(c,c.g)} · R ≥ ${fmtThr(c,c.r)}`;
}
function critHelp(type){
  const c={type}, k=critKind(c);
  if(k==="bool") return "Sí pinta verde, No pinta rojo.";
  if(k==="date") return "Se captura la fecha comprometida o lograda. Súper verde es la fecha más temprana; verde, la fecha límite que se considera en camino; de la fecha roja en adelante, rojo. El amarillo es automático: es lo que queda entre verde y rojo.";
  const unit = k==="pct" ? " Se captura el porcentaje de avance, de 0 a 100." : "";
  return (critDir(c)==="up" ? "Cuanto más, mejor: igualar o superar súper verde es súper verde; quedar en rojo o abajo es rojo." : "Cuanto menos, mejor: igualar o bajar de súper verde es súper verde; quedar en rojo o arriba es rojo.") + " El amarillo es automático: es el rango entre rojo y verde." + unit;
}
function normCrit(cr){
  const k=critKind(cr);
  if(k==="bool") return {type:"bool"};
  if(k==="date") return {type:cr.type, sg:cr.sg, g:cr.g, r:cr.r};
  return {type:cr.type, sg:toNum(cr,cr.sg), g:toNum(cr,cr.g), r:toNum(cr,cr.r)};
}
const thrAttrs = type => critKind({type})==="date" ? 'type="date"' : 'type="text" inputmode="decimal"';
const repKey = (pid,w) => `${pid}_w${w}`;
function repOf(pid,w){ return S.reports[repKey(pid,w)]; }
function indStatus(p,w){ const r=repOf(p.id,w); return r? statusFor(p.criteria, r.value) : "N"; }
/* Estado de la prioridad de empresa = promedio de sus individuales reportadas; un rojo nunca queda tapado por verdes: si hay rojo, el máximo es amarillo. */
function coStatus(co,w){
  const st = kidsOf(co.id).map(k=>indStatus(k,w)).filter(s=>s!=="N");
  if(!st.length) return "N";
  const avg = st.reduce((a,s)=>a+SCORE[s],0)/st.length;
  let res = avg>=3.5?"S":avg>=2.5?"G":avg>=1.5?"Y":"R";
  if(st.includes("R") && (res==="S"||res==="G")) res="Y";
  return res;
}

/* ---------- Selectores de datos ---------- */
const byOrder = (a,b)=>(a.order??0)-(b.order??0) || String(a.createdAt).localeCompare(String(b.createdAt));
function qById(id){ return S.quarters.find(q=>q.id===id); }
function coOf(qid){ return S.priorities.filter(p=>p.quarterId===qid && p.kind==="company").sort(byOrder); }
function kidsOf(pid){ return S.priorities.filter(p=>p.parentId===pid && p.kind==="individual").sort(byOrder); }
function indsOfQ(qid){ return coOf(qid).flatMap(c=>kidsOf(c.id)); }
function owners(){ return [...new Set(S.priorities.filter(p=>!p.demo).map(p=>p.owner).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es")); }
function sortedQuarters(){ return [...S.quarters].sort((a,b)=>(a.demo?1:0)-(b.demo?1:0) || String(b.start).localeCompare(String(a.start))); }
function pickQuarter(){
  if(S.qid && qById(S.qid)) return;
  const saved = store.get("focus.qid");
  const hasReal = S.quarters.some(q=>!q.demo);
  if(saved && qById(saved) && !(qById(saved).demo && hasReal)){ S.qid=saved; return; }
  const act = S.quarters.find(q=>q.active&&!q.demo); S.qid = act? act.id : (sortedQuarters()[0]?.id ?? null);
}

/* ---------- Render ---------- */
function setView(v){ if(v!=="semanas") S.focus=null; S.view=v; store.set("focus.view",v); render(); }
function goTo(pid,w){
  S.focus={pid,w}; S.view="semanas"; store.set("focus.view","semanas"); render();
  const row=document.getElementById("row-"+pid);
  if(row){ row.scrollIntoView({block:"center",behavior:"smooth"}); row.querySelector(`[data-w="${w}"]`)?.focus({preventScroll:true}); }

qsel.addEventListener("change",()=>{ S.qid=qsel.value; store.set("focus.qid",S.qid); render(); });

function renderQsel(){
  const qs = sortedQuarters();
  qsel.innerHTML = qs.length ? qs.map(q=>`<option value="${esc(q.id)}" ${q.id===S.qid?"selected":""}>${esc(q.label)}${q.active?" · activo":""}${q.demo?" · ejemplo":""}</option>`).join("") : `<option>Sin trimestres</option>`;
  qsel.disabled = !qs.length;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.view===S.view)));
  if(S.error){ app.innerHTML = `<div class="panel empty"><h3>No se pudo abrir el mapa</h3><p>${esc(S.error)}</p></div>`; return; }
  if(!(S.loaded.q&&S.loaded.p&&S.loaded.r)) return;
  pickQuarter(); renderQsel();
  const ro = !S.canWrite ? `<div class="notice">Estás en modo lectura: puedes ver el mapa pero no editarlo.</div>`
    : !S.canAdmin ? `<div class="notice">Puedes reportar los avances de cada semana. Solo los editores crean trimestres y cambian prioridades o criterios.</div>` : "";
  if(S.view==="trimestres"){ app.innerHTML = ro + viewQuarters(); }
  else if(!S.qid){ app.innerHTML = ro + emptyQuarter(); }
  else if(S.view==="semanas"){ app.innerHTML = ro + viewWeeks(); }
  else { app.innerHTML = ro + viewMap(); }
}

    </div>${kids.length&&open?`<div class="kids">${kids.map(k=>{const r=repOf(k.id,cw), st=indStatus(k,cw);

    ${cos.length?`<div class="gridbox"><table class="grid"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><h3>Sin prioridades de empresa</h3><p>Crea la primera prioridad de empresa y luego asigna las individuales con su criterio de aceptación.</p></div>`}
  </section>` + legend(q);
}
function compact(p,v){
  const k=critKind(p.criteria);
  if(k==="bool") return (v===true||v==="true")?"Sí":"No";
  if(k==="date"){ if(!isISO(v)) return ""; const [,m,d]=v.split("-"); return `${+d}/${+m}`; }
  if(k==="pct"){ const n=Number(v); return Number.isNaN(n)?"":`${Math.round(n)}%`; }
  const n=Number(v); if(Number.isNaN(n)) return "";
  const a=Math.abs(n);
  if(a>=10000) return Math.round(n/1000)+"k";
  if(a>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"k";
  return Number.isInteger(n)? String(n) : n.toFixed(1);
}

/* Trimestre fijo de 13 semanas: arranca el lunes de la semana que contiene el día 1 del trimestre calendario */
function qDates(year,qn){
  const d=new Date(Date.UTC(year,(qn-1)*3,1)), dow=(d.getUTCDay()+6)%7;
  const st=new Date(d.getTime()-dow*864e5), en=new Date(st.getTime()+(13*7-1)*864e5);
  return {start:st.toISOString().slice(0,10), end:en.toISOString().slice(0,10)};
}

async function exportXLSX(btn){

      });

    const wb=X.utils.book_new();

    const s1=X.utils.aoa_to_sheet(vals); s1["!cols"]=[{wch:4},{wch:40},{wch:36},{wch:14},{wch:30},{wch:10},{wch:8},{wch:8}]; X.utils.book_append_sheet(wb,s1,"Valores semanales");
    const s2=X.utils.aoa_to_sheet(sts); s2["!cols"]=[{wch:4},{wch:40},{wch:36},{wch:14}]; X.utils.book_append_sheet(wb,s2,"Semáforo");
    const log=[["Semana","Prioridad de empresa","Prioridad individual","Responsable","Valor","Estado","Reportó","Fecha de captura","Tarde","Causa","Acción","Fecha compromiso"]];
    coOf(q.id).forEach(c=>kidsOf(c.id).forEach(k=>wk.forEach(w=>{const r=repOf(k.id,w); if(!r) return;
      log.push([wn(q,w),plain(c.name),plain(k.name),k.owner||"",fmtVal(k,r.value),STATUS[statusFor(k.criteria,r.value)].name, r.demo?"ejemplo":(r.reportedBy?(S.names[r.reportedBy]||r.reportedBy):"sin registro"), r.updatedAt?r.updatedAt.slice(0,16).replace("T"," "):"", isLate(q,r)?"Sí":"", r.note?.cause||"", r.note?.action||"", r.note?.due||""]);})));
    const s3=X.utils.aoa_to_sheet(log); s3["!cols"]=[{wch:8},{wch:40},{wch:36},{wch:14},{wch:10},{wch:12},{wch:22},{wch:17}]; X.utils.book_append_sheet(wb,s3,"Bitácora");
    const buf=X.write(wb,{type:"array",bookType:"xlsx"});

  }finally{ btn.disabled=false; btn.textContent=label; }
}

  if(WZ.step===1){
    if(!WZ.theme.trim()||!WZ.success.trim()) return wzFail("El tema y la meta medible son obligatorios.");
    if(S.quarters.some(q=>!q.demo&&q.label===wzLabel())) return wzFail(`Ya existe un trimestre ${wzLabel()}. Elige otro trimestre o edita el existente.`);
    if(WZ.mode==="copy"){ const n=coOf(WZ.copyFrom).length; if(n>S.maxCo) return wzFail(`El trimestre origen tiene ${n} prioridades de empresa y el tope es ${S.maxCo}. Elige otro origen o sube el tope en Trimestres.`); }
    if(WZ.mode==="assistant"){ WZ.step=2; return wizardRender(); }
    return wizardFinish();
  }
  if(WZ.step===2){ if(!WZ.co.name.trim()) return wzFail("Escribe la prioridad de empresa."); if(S.goals.length&&!WZ.co.goalId) return wzFail("Elige qué meta del año empuja."); WZ.step=3; return wizardRender(); }
  for(const [i,k] of WZ.kids.entries()){
    if(!k.name.trim()) return wzFail(`Falta el nombre de la individual ${i+1}.`);
    const v=critValid(k.criteria); if(!v.ok) return wzFail(`Individual ${i+1}: ${v.msg}`);
  }
  return wizardFinish();
}
async function wizardFinish(){
  const btn=dlg.querySelector("#w-next"); btn.disabled=true; btn.textContent="Creando…";
  const now=()=>new Date().toISOString();
  const crit=normCrit;
  try{
    const d=qDates(WZ.year,WZ.qn);
    const ref=await S.db.collection("quarters").add({label:wzLabel(),theme:WZ.theme.trim(),success:WZ.success.trim(),start:d.start,end:d.end,active:WZ.active,createdAt:now()});
    const qid=ref.id;
    if(WZ.active) await deactivateOthers(qid);
    const addP=data=>S.db.collection("priorities").add({...data,quarterId:qid,createdAt:now()});
    if(WZ.mode==="assistant"){
      const co=await addP({kind:"company",parentId:null,name:WZ.co.name.trim(),owner:WZ.co.owner.trim(),goalId:WZ.co.goalId||null,order:0});
      for(const [j,k] of WZ.kids.entries()) await addP({kind:"individual",parentId:co.id,name:k.name.trim(),icon:k.icon||"•",owner:k.owner.trim(),order:j,criteria:crit(k.criteria)});
    } else if(WZ.mode==="copy"){
      for(const [i,c] of coOf(WZ.copyFrom).entries()){
        const co=await addP({kind:"company",parentId:null,name:c.name,owner:c.owner||"",goalId:S.goals.some(g=>g.id===c.goalId)?c.goalId:null,order:i,copyCount:(c.copyCount||0)+1});
        for(const [j,k] of kidsOf(c.id).entries()) await addP({kind:"individual",parentId:co.id,name:k.name,icon:k.icon||"•",owner:k.owner||"",order:j,criteria:k.criteria||{type:"bool"},copyCount:(k.copyCount||0)+1});
      }
    }
    S.qid=qid; store.set("focus.qid",qid); dlg.close(); toast(`${wzLabel()} creado`);
    setView(WZ.mode==="blank"?"semanas":"mapa");
  }catch(e){ btn.disabled=false; btn.textContent="Crear trimestre"; wzFail("No se pudo crear: "+(e.message||e.code)); }
}
function suggestQuarter(){
  const last = sortedQuarters()[0];
  let start;
  if(last && parseDate(last.end)){ start=new Date(parseDate(last.end).getTime()+864e5); }
  else { const t=todayUTC(); const dow=(t.getUTCDay()+6)%7; start=new Date(t.getTime()-dow*864e5); }
  const end=new Date(start.getTime()+(13*7-1)*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  const mid=new Date(start.getTime()+45*864e5);
  return {label:`${Math.floor(mid.getUTCMonth()/3)+1}Q ${mid.getUTCFullYear()}`,theme:"",success:"",start:iso(start),end:iso(end),active:!S.quarters.some(q=>q.active)};
}
async function deactivateOthers(id){ for(const q of S.quarters) if(!q.demo && q.id!==id && q.active) await S.db.doc("quarters/"+q.id).update({active:false}); }
async function deleteQuarter(id){
  for(const c of coOf(id)) await deletePriority(c.id);
  await S.db.doc("quarters/"+id).delete();
  if(S.qid===id) S.qid=null;
}
async function deletePriority(pid){
  const p = S.priorities.find(x=>x.id===pid);
  if(p?.kind==="company") for(const k of kidsOf(pid)) await deletePriority(k.id);
  for(const key of Object.keys(S.raw.r)) if(S.raw.r[key].priorityId===pid) await S.db.doc("reports/"+key).delete();
  await S.db.doc("priorities/"+pid).delete();
}

function valueInput(p, id, cur){
  const k=critKind(p.criteria);
  if(k==="date") return `<input class="input mono" type="date" id="${id}" value="${esc(isISO(cur)?cur:"")}">`;
  if(k==="pct") return `<input class="input mono" id="${id}" inputmode="decimal" value="${esc(cur??"")}" placeholder="% de avance">`;
  if(k==="bool") return `<select class="input" id="${id}"><option value="">—</option><option value="true" ${cur===true||cur==="true"?"selected":""}>Sí</option><option value="false" ${cur===false||cur==="false"?"selected":""}>No</option></select>`;
  return `<input class="input mono" id="${id}" inputmode="decimal" value="${esc(cur??"")}" placeholder="—">`;
}
function parseValue(p, raw){
  if(raw==="") return null;
  const k=critKind(p.criteria);
  if(k==="bool") return raw==="true";
  if(k==="date") return isISO(raw) ? raw : undefined;
  const n=Number(raw.replace("%","").replace(",",".")); if(Number.isNaN(n)) return undefined;
  if(k==="pct" && (n<0||n>100)) return undefined;
  return n;
}
async function saveReport(p,w,v,note){
  const key=repKey(p.id,w), prev=S.raw.r[key], now=new Date().toISOString();
  if(v===null){ if(prev) await S.db.doc("reports/"+key).delete(); return; }
  await S.db.doc("reports/"+key).set({priorityId:p.id,quarterId:p.quarterId,week:w,value:v,updatedAt:now,firstAt:prev?.firstAt||prev?.updatedAt||now,reportedBy:S.me||null,note:needsNote(p,v)?note:null});
}

function who(r){

      }));

        }catch(e){ err.textContent="No se pudo guardar: "+(e.message||e.code); }
      });
    }});
}

/* ---------- Ficha del KPI: fuente, fórmula y evidencia (la captura el equipo) ---------- */
const safeUrl = u => /^https:\/\//i.test(String(u||"").trim()) ? String(u).trim() : (String(u||"").startsWith("/_blob/") ? String(u) : "");
const metaOf = pid => (S.meta||{})[pid] || {};
function fichaFilled(pid){ const m=metaOf(pid); return !!(m.source&&m.source.trim()); }
function fichaBtn(pid){ const m=metaOf(pid), ok=fichaFilled(pid), n=(m.links||[]).length+(m.files||[]).length;
  return `<button class="icon-btn fbtn ${ok?"ok":"miss"}" data-act="ficha" data-id="${pid}" title="${ok?"Fuente y fórmula del KPI"+(n?" · "+n+" evidencia(s)":""):"Falta la fuente del dato"}">${ok?"Fuente ✓":"Fuente ?"}</button>`; }
function fichaSummary(pid){ const m=metaOf(pid); if(!m.source&&!m.formula&&!(m.links||[]).length&&!(m.files||[]).length) return `<p class="help">Este KPI no tiene fuente ni fórmula. Captúralas abriendo el KPI (clic en su nombre).</p>`;
  const lk=(m.links||[]).map(l=>{const u=safeUrl(l.url); return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l.label||u)}</a>`:""}).filter(Boolean)
    .concat((m.files||[]).map(f=>{const u=safeUrl(f.url); return u?`<a href="${esc(u)}" target="_blank" rel="noopener"> ${esc(f.name||"archivo")}</a>`:""}).filter(Boolean));
  return `<div class="fsum">${m.source?`<div><b>Fuente:</b> ${esc(m.source)}</div>`:""}${m.formula?`<div><b>Fórmula:</b> <span class="mono">${esc(m.formula)}</span></div>`:""}${lk.length?`<div class="ln"><b>Evidencia:</b> ${lk.join(" · ")}</div>`:""}</div>`; }
function fichaBlock(pid){
  const m=metaOf(pid), can=S.canWrite!==false, empty=!fichaFilled(pid);
  return `<details class="fdet" ${empty?"open":""}><summary><b>Fuente, fórmula y evidencia</b> <span class="fbtn ${empty?"miss":"ok"}">${empty?"falta la fuente":"✓ capturada"}</span></summary>
    <div class="fbody">
      <div class="field"><label for="f-src">Fuente del dato</label><textarea class="input" id="f-src" rows="2" ${can?"":"disabled"} placeholder="De dónde sale el número: base de Notion y vista, hoja de Drive, reporte de GHL, correo… Específico, para que cualquiera llegue al mismo dato.">${esc(m.source||"")}</textarea></div>
      <div class="field"><label for="f-frm">Fórmula (si aplica)</label><textarea class="input mono" id="f-frm" rows="2" ${can?"":"disabled"} placeholder="Ej.: materiales enviados en o antes de su fecha compromiso ÷ materiales con fecha compromiso en la semana × 100">${esc(m.formula||"")}</textarea></div>
      <div class="field"><label>Links</label><div class="flist" id="f-links"></div>${can?`<button class="btn" id="f-addlink" type="button" style="justify-self:start">+ Link</button>`:""}</div>
      <div class="field"><label>Archivos</label><div class="flist" id="f-files"></div>${can?`<label class="btn" style="justify-self:start;cursor:pointer">+ Subir archivo<input type="file" id="f-up" hidden></label><p class="help" id="f-uph">PDF, imagen, CSV o texto, hasta 20 MB.</p>`:""}</div>
      ${m.updatedAt?`<p class="help">Ficha actualizada: ${esc(new Date(m.updatedAt).toLocaleString("es-MX",{dateStyle:"medium",timeStyle:"short"}))}${m.updatedByName?" · "+esc(m.updatedByName):""}</p>`:""}
    </div></details>`;
}
function mountFicha(pid){
  const m=metaOf(pid), can=S.canWrite!==false;
  let links=(m.links||[]).map(x=>({label:x.label||"",url:x.url||""})), files=(m.files||[]).slice(), touched=false;
  const lbox=dlg.querySelector("#f-links"), fbox=dlg.querySelector("#f-files");
  const syncL=()=>{ lbox.querySelectorAll(".fr").forEach((r,i)=>{ links[i]={label:r.querySelector("[data-l]").value.trim(),url:r.querySelector("[data-u]").value.trim()}; }); };
  const drawL=()=>{ lbox.innerHTML=links.length?links.map((l,i)=>`<div class="fr"><input class="input" data-l value="${esc(l.label)}" placeholder="Nombre (ej. Vista Notion)" ${can?"":"disabled"}><input class="input" data-u value="${esc(l.url)}" placeholder="https://…" ${can?"":"disabled"}>${can?`<button class="icon-btn" type="button" data-rm="${i}" aria-label="Quitar link">✕</button>`:"<span></span>"}</div>`).join(""):`<p class="help">Sin links.</p>`;
    lbox.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ syncL(); links.splice(+b.dataset.rm,1); touched=true; drawL(); }));
    lbox.querySelectorAll("input").forEach(x=>x.addEventListener("input",()=>{touched=true;})); };
  const drawF=()=>{ fbox.innerHTML=files.length?files.map((f,i)=>{const u=safeUrl(f.url); return `<div class="ff">${fmIcoClip} ${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(f.name||"archivo")}</a>`:esc(f.name||"archivo")}${can?`<button class="icon-btn" type="button" data-frm="${i}" aria-label="Quitar archivo">✕</button>`:""}</div>`;}).join(""):`<p class="help">Sin archivos.</p>`;
    fbox.querySelectorAll("[data-frm]").forEach(b=>b.addEventListener("click",()=>{ files.splice(+b.dataset.frm,1); touched=true; drawF(); })); };
  drawL(); drawF();
  ["f-src","f-frm"].forEach(id=>dlg.querySelector("#"+id).addEventListener("input",()=>{touched=true;}));
  if(can){
    dlg.querySelector("#f-addlink").addEventListener("click",()=>{ syncL(); links.push({label:"",url:""}); drawL(); lbox.querySelector(".fr:last-child [data-l]")?.focus(); });
    const up=dlg.querySelector("#f-up"), uph=dlg.querySelector("#f-uph");
    up.addEventListener("change", async()=>{ const f=up.files&&up.files[0]; if(!f) return;
      if(f.size>20*1024*1024){ uph.textContent="El archivo pasa de 20 MB."; return; }
      const assets = window.claude ? await window.claude.use("assets") : null;
      if(!assets){ uph.textContent="Tu acceso no permite subir archivos aquí. Pega un link de Drive en su lugar."; return; }
      uph.textContent="Subiendo…";
      try{ const r=await assets.upload(f); files.push({id:r.id,url:r.url||("/_blob/"+r.id),name:f.name,type:r.contentType||f.type||""}); touched=true; drawF(); uph.textContent="Archivo listo; se guarda con el reporte."; }
      catch(e){ uph.textContent="No se pudo subir: "+(e.message||e.code||"error"); }
      up.value=""; });
  }
  return {
    check(){ syncL(); const bad=links.find(l=>l.url&&!/^https:\/\//i.test(l.url)); return bad?"Los links deben empezar con https://":""; },
    async save(){ if(!can||!touched) return; syncL();
      let name=null; try{ if(S.user&&S.me){ const ps=await S.user.profiles([S.me]); name=ps?.[S.me]?.name||null; } }catch(e){}
      await S.db.doc("kpimeta/"+pid).set({source:val("f-src"),formula:val("f-frm"),links:links.filter(l=>l.url),files,updatedAt:new Date().toISOString(),updatedBy:S.me||null,updatedByName:name||null}); }
  };
}
function cellModal(pid,w){
  const k=S.priorities.find(x=>x.id===pid), r=repOf(pid,w), q=qById(k.quarterId);
  const st0=r?statusFor(k.criteria,r.value):"N";
  openModal({eyebrow:`${k.owner||""} · semana ${wn(q,w)} del año · cierre ${fmtDeadline(deadlineOf(q,w))}`, title:k.name,
    body:`${fichaSummary(pid)}<div class="field"><label for="v-cell">Valor de la semana ${wn(q,w)}</label>${valueInput(k,"v-cell",r?.value)}</div>
      <div class="try"><span class="mono">${critText(k.criteria)}</span><span>→</span><span id="f-tryout"></span></div>
      <div id="nw-cell" ${S.reqNotes&&["Y","R"].includes(st0)?"":"hidden"}>${noteFields("nc", r?.note, st0)}</div>
      ${r?`<p class="help">Último reporte: <b>${esc(fmtVal(k,r.value))}</b> · ${esc(who(r))}${isLate(q,r)?" · llegó tarde":""}</p>`:""}<p class="err" id="f-err"></p>`,
    foot:`${r?`<button class="btn danger" id="f-clear">Borrar reporte</button>`:"<span></span>"}<span style="display:flex;gap:8px"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="f-save">Guardar</button></span>`,
    onMount(){
      const upd=()=>{ const v=parseValue(k,val("v-cell")); const s=(v===null||v===undefined)?"N":statusFor(k.criteria,v);
        dlg.querySelector("#f-tryout").innerHTML=`<span style="display:inline-flex;gap:8px;align-items:center"><i class="chip sm ${s}">${letter(s)}</i>${STATUS[s].name}</span>`;
        const box=dlg.querySelector("#nw-cell"); box.hidden=!(S.reqNotes&&["Y","R"].includes(s)); const nb=box.querySelector(".notebox"); nb.classList.toggle("R",s==="R"); nb.querySelector(".h").textContent=`Quedó en ${s==="R"?"rojo":"amarillo"}: explica antes de guardar`; };
      dlg.querySelector("#v-cell").addEventListener("input",upd); upd();
      dlg.querySelector("#f-save").addEventListener("click", async()=>{
        const v=parseValue(k,val("v-cell")), err=dlg.querySelector("#f-err");
        if(v===undefined){ err.textContent="Escribe un número."; return; }
        const note=needsNote(k,v)?readNote("nc"):null;
        if(note && !noteOk(note)){ err.textContent="Quedó en amarillo o rojo: falta causa, acción o fecha."; return; }
        try{ await saveReport(k,w,v,note); dlg.close(); toast("Reporte guardado"); }catch(e){ err.textContent="No se pudo guardar: "+(e.message||e.code); }
      });
      dlg.querySelector("#f-clear")?.addEventListener("click", async()=>{ try{ await saveReport(k,w,null); dlg.close(); toast("Reporte borrado"); }catch(e){ toast("No se pudo borrar"); } });
    }});
}

async function move(pid,d){
  const p=S.priorities.find(x=>x.id===pid), sib=p.kind==="individual"?kidsOf(p.parentId):coOf(p.quarterId), i=sib.findIndex(x=>x.id===pid), j=i+d;
  if(j<0||j>=sib.length) return;
  [sib[i],sib[j]]=[sib[j],sib[i]];
  try{ for(let n=0;n<sib.length;n++) if(sib[n].order!==n) await S.db.doc("priorities/"+sib[n].id).update({order:n}); }catch(e){ toast("No se pudo reordenar"); }
}

app.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]");
  if(!b || b.dataset.act!=="info") document.querySelectorAll(".pop:not([hidden])").forEach(p=>{p.hidden=true; document.querySelector(`[data-pop="${p.id}"]`)?.setAttribute("aria-expanded","false");});
  if(!b) return;
  const id=b.dataset.id, a=b.dataset.act;
  if(a==="new-q") wizardStart();
  else if(a==="edit-q") quarterModal(qById(id));
  else if(a==="open-q"){ S.qid=id; store.set("focus.qid",id); setView("mapa"); }
  else if(a==="activate-q"){ S.db.doc("quarters/"+id).update({active:true}).then(()=>deactivateOthers(id)).then(()=>toast("Trimestre activado")).catch(()=>toast("No se pudo activar")); }
  else if(a==="year"){ S.year=b.dataset.y; render(); }
  else if(a==="settings") settingsModal();
  else if(a==="goto"){ goTo(id, Number(b.dataset.w)); }
  else if(a==="toggle"){ S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id); render(); }
  else if(a==="info"){ const pop=document.getElementById(b.dataset.pop); const open=pop.hidden; pop.hidden=!open; b.setAttribute("aria-expanded",String(open)); }
  else if(a==="hide-demo"){ store.set("focus.demoHidden","1"); if(qById(S.qid)?.demo) S.qid=null; compose(); render(); toast("Ejemplo oculto"); }
  else if(a==="show-demo"){ store.set("focus.demoHidden","0"); compose(); render(); }
  else if(a==="new-co") companyModal();
  else if(a==="edit-co") companyModal(S.priorities.find(x=>x.id===id));
  else if(a==="new-ind") individualModal(id);
  else if(a==="edit-ind") individualModal(null, S.priorities.find(x=>x.id===id));
  else if(a==="move") move(id, Number(b.dataset.d));
  else if(a==="cell") cellModal(id, Number(b.dataset.w));
  else if(a==="report") reportModal(Number(b.dataset.w));
});

/* ---------- Arranque ---------- */
S.view = ["mapa","semanas","trimestres"].includes(store.get("focus.view")) ? store.get("focus.view") : "mapa";
render();
const timer = setTimeout(()=>{ if(!(S.loaded.q&&S.loaded.p&&S.loaded.r)){ S.error="El servidor de datos no respondió. Revisa la conexión con la intranet o avisa a sistemas."; render(); } }, 60000);

(async()=>{
  const db = window.claude ? await window.claude.use("db") : null;
  if(!db){ clearTimeout(timer); S.error="No se encontró la capa de datos del Focus Map."; render(); return; }
  S.db=db;
  const user = await window.claude.use("user");
  S.user=user;
  if(user){ try{ S.me=await user.id(); }catch(e){} }
  /* Permisos: por defecto se muestran los controles y el servidor decide; solo se ocultan si la plataforma dice explícitamente que no */
  S.canAdmin = true; S.access = "sin dato";
  if(user){
    const safe = async f => { try{ return await f(); }catch(e){ return null; } };
    const w = await safe(()=>user.can("data.write")), own = await safe(()=>user.isOwner()), ed = await safe(()=>user.canEdit());
    if(w===false) S.canWrite=false;
    if(own===false && ed===false) S.canAdmin=false;
    if(!S.canWrite) S.canAdmin=false;
    S.access = own ? "dueño" : ed ? "editor" : S.canWrite ? "colaborador" : "solo lectura";
  }
  db.doc("settings/config").onSnapshot(d=>{ const c=d.exists?(d.data()||{}):{}; const m=Number(c.maxCompany); S.maxCo = m>=1&&m<=10 ? m : 5;
    S.dlDay = Number.isInteger(c.deadlineDay)&&c.deadlineDay>=0&&c.deadlineDay<=8 ? c.deadlineDay : 7; S.dlHour = Number.isInteger(c.deadlineHour) ? c.deadlineHour : 9; S.reqNotes = c.requireNotes===true;
    S.goals = Array.isArray(c.goals) ? c.goals.filter(g=>g&&g.id&&g.name) : []; render(); }, ()=>{});

  const fail = e => { clearTimeout(timer); S.error="No se pudieron leer los datos ("+(e?.code||"error")+")."; render(); };
  const done = () => { if(S.loaded.q&&S.loaded.p&&S.loaded.r){ clearTimeout(timer); S.error=null; } render(); };
  db.collection("quarters").onSnapshot(s=>{ S.raw.q=s.docs.map(d=>({id:d.id,...d.data()})); compose(); S.loaded.q=true; done(); }, fail);
  db.collection("priorities").onSnapshot(s=>{ S.raw.p=s.docs.map(d=>({id:d.id,...d.data()})); compose(); S.loaded.p=true; done(); }, fail);
  db.collection("reports").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); S.raw.r=m; compose(); S.loaded.r=true; resolveNames(); done(); }, fail);
  db.collection("kpimeta").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); S.meta=m; render(); }, ()=>{});
})();
})();
</script>
